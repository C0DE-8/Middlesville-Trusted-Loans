<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Agents | Middlesville Trusted Loans</title>
    <link rel="stylesheet" href="../../../assets/vendors/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/admin.css?v=20260829-3">
</head>
<body class="admin-dashboard-page">
    <header class="admin-header">
        <a href="../../../index.html" class="admin-header__logo">
            <img src="../../../assets/images/logo-dark.png" alt="Middlesville Trusted Loans" width="150">
        </a>
        <nav class="admin-header__nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="applications.html">Applications</a>
            <a href="agents.html">Agents</a>
            <a href="mailer.html">Mailer</a>
            <a href="../../../index.html">View Site</a>
            <span id="admin-name">Admin</span>
            <button id="logout-button" type="button">Logout</button>
        </nav>
    </header>

    <main class="admin-dashboard">
        <section class="admin-dashboard__intro">
            <h1>Referral Agents</h1>
            <p>Set the payout rule and review agent referrals based on approved borrower loan applications.</p>
        </section>

        <section class="admin-panel">
            <div class="admin-panel__heading">
                <h2>Referral Payout Rule</h2>
                <span id="referral-settings-updated">Loading...</span>
            </div>
            <form id="referral-settings-form" class="admin-form admin-form--inline">
                <label for="required-approved-applications">Approved Applications Required</label>
                <input id="required-approved-applications" name="requiredApprovedApplications" type="number" min="1" step="1" required>

                <label for="payout-amount">Payout Amount</label>
                <input id="payout-amount" name="payoutAmount" type="number" min="0" step="0.01" required>

                <button type="submit">
                    <span class="admin-button__spinner" aria-hidden="true"></span>
                    <span class="admin-button__label">Save Rule</span>
                </button>
                <p id="referral-settings-message" class="admin-form__message" aria-live="polite"></p>
            </form>
        </section>

        <section class="admin-panel">
            <div class="admin-panel__heading">
                <h2>Agent Performance</h2>
                <span id="agent-count">0 agents</span>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Agent</th>
                            <th>Referral Code</th>
                            <th>Applications</th>
                            <th>Payout</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="agents-table">
                        <tr>
                            <td colspan="6">Loading agents...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../../assets/vendors/axios/axios.min.js"></script>
    <script src="../../../assets/js/axios.js?v=20260829-2"></script>
    <script src="js/admin.js?v=20260829-3"></script>
</body>
</html>
