<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Middlesville Trusted Loans</title>
    <link rel="stylesheet" href="../../../assets/vendors/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/admin.css?v=20260827-2">
</head>
<body class="admin-auth-page">
    <main class="admin-auth">
        <section class="admin-auth__panel">
            <a href="../../../index.html" class="admin-auth__logo">
                <img src="../../../assets/images/logo-dark.png" alt="Middlesville Trusted Loans" width="150">
            </a>
            <h1>Admin Login</h1>
            <p>Access the Middlesville Trusted Loans admin dashboard.</p>
            <form id="admin-login-form" class="admin-form">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <p id="login-message" class="admin-form__message" aria-live="polite"></p>
                <button type="submit">
                    <span class="admin-button__spinner" aria-hidden="true"></span>
                    <span class="admin-button__label">Sign In</span>
                </button>
            </form>
        </section>
    </main>
    <script src="../../../assets/vendors/axios/axios.min.js"></script>
    <script src="../../../assets/js/axios.js?v=20260827-4"></script>
    <script src="js/admin.js?v=20260827-2"></script>
</body>
</html>
