<p>A new loan application was submitted on the Middlesville Trusted Loans website.</p>

<div class="summary">
  <div class="summary-row">
    <span class="summary-label">Applicant</span>
    <span class="summary-value">{{full_name}}</span>
  </div>
  <div class="summary-row">
    <span class="summary-label">Email</span>
    <span class="summary-value">{{email}}</span>
  </div>
  <div class="summary-row">
    <span class="summary-label">Phone</span>
    <span class="summary-value">{{phone}}</span>
  </div>
  <div class="summary-row">
    <span class="summary-label">Loan Purpose</span>
    <span class="summary-value">{{loan_purpose}}</span>
  </div>
  <div class="summary-row">
    <span class="summary-label">Requested Amount</span>
    <span class="summary-value">{{loan_amount}}</span>
  </div>
  <div class="summary-row">
    <span class="summary-label">Status</span>
    <span class="summary-value"><span class="status-badge">{{status}}</span></span>
  </div>
</div>
